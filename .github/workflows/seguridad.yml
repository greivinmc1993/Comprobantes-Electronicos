name: Seguridad - Auditoría de dependencias

on:
  workflow_dispatch:
  schedule:
    - cron: '40 9 * * 1'

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Auditoría de seguridad (alta y crítica bloquean)
        shell: bash
        run: |
          mkdir -p qa-results
          npm audit --omit=dev --audit-level=high --json > qa-results/auditoria-npm.json
          # No se ignora el código de salida. Un hallazgo de seguridad relevante
          # hace fallar el job y se adjunta el informe en el paso always().
      - name: Descargar informe de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguridad-npm
          path: qa-results/auditoria-npm.json
          if-no-files-found: warn
          retention-days: 30
