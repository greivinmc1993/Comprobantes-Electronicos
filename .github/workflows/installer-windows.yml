name: Build - Instalador NSIS Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  instalador:
    name: ComprobantesElectronicosCR x64
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Instalar dependencias y módulos nativos
        run: npm install --no-audit --no-fund
      - name: Comprobar la sintaxis
        run: npm run check:syntax
      - name: Ejecutar todos los tests de Node/SQLite/API
        run: npm run test:ci
      - name: Compilar frontend y validar recursos
        run: npm run build && npm run check:package
      - name: Compilar instalador NSIS x64
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verificar archivo de instalación
        shell: pwsh
        run: |
          $instaladores = @(Get-ChildItem -Path release -Filter 'ComprobantesElectronicosCR-Setup-*-x64.exe' -File)
          if ($instaladores.Count -eq 0) { throw 'No se generó el instalador NSIS x64' }
          foreach ($exe in $instaladores) {
            if ($exe.Length -lt 1000000) { throw "Instalador sospechosamente pequeño: $($exe.Name)" }
            Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
          }
      - name: Subir instalador como artefacto privado de Actions
        uses: actions/upload-artifact@v4
        with:
          name: ComprobantesElectronicosCR-Instalador-Windows
          path: release/ComprobantesElectronicosCR-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Subir JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-junit-build-windows
          path: qa-results/*.xml
          if-no-files-found: warn
